name: Security Guardrails Platform

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["main"]

jobs:

  policy-as-code:
    name: OPA Policy Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          tar xzf conftest_0.68.2_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Debug Conftest Output
        if: always()
        run: |
          echo "=== conftest_raw.json ==="
          cat findings/conftest_raw.json || echo "FILE NOT FOUND OR EMPTY"   

      - name: Generate Terraform JSON
        run: |
          python scripts/tf_to_json.py    

      - name: Generate OPA Findings JSON
        if: always()
        run: |
          python scripts/generate_opa_findings.py

      - name: Run OPA Policy Check
        run: |
          mkdir -p findings
          conftest test terraform/plan.json --policy policies/ --output json > findings/conftest_raw.json || true

      - name: Upload OPA Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-findings
          path: findings/opa_findings.json

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Create Findings Directory
        run: |
          mkdir -p findings

      - name: Scan for Secrets
        run: |
          detect-secrets scan . \
            --exclude-files '\.secrets\.baseline' \
            > findings/secrets_raw.json

      - name: Validate Secret Findings
        run: |
          python scripts/check_secrets.py

      - name: Upload Secret Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-findings
          path: findings/secrets_raw.json    

  sast:
    name: SAST Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Create Findings Directory
        run: |
          mkdir -p findings

      - name: Run Semgrep
        run: |
          semgrep \
            --config semgrep/custom-rules.yml \
            --json \
            --output findings/sast_findings.json \
            scripts/vulnerable_app.py || true

      - name: Debug SAST Output
        if: always()
        run: |
          echo "=== FILES ==="
          find findings -type f

          echo ""
          echo "=== sast_findings.json ==="
          cat findings/sast_findings.json || echo "FILE NOT FOUND"      

      - name: Validate SAST Findings
        run: |
          python scripts/check_sast.py

      - name: Upload SAST Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-findings
          path: findings/sast_findings.json    

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Create Findings Directory
        run: |
          mkdir -p findings

      - name: Run Dependency Scan
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output findings/sca_findings.json || true

      - name: Validate Dependency Findings
        run: |
          python scripts/check_dependencies.py

      - name: Upload SCA Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-findings
          path: findings/sca_findings.json    

  suppression-validation:
    name: Suppression Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Validate Suppressions
        run: |
          python scripts/validate_suppressions.py

      - name: Upload Valid Suppressions
        uses: actions/upload-artifact@v4
        with:
          name: valid-suppressions
          path: findings/valid_suppressions.json

  remediation-enrichment:
    name: Remediation Enrichment
    runs-on: ubuntu-latest

    needs:
      - suppression-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Create Findings Directory
        run: |
          mkdir -p findings

      - name: Download Valid Suppressions
        uses: actions/download-artifact@v4
        with:
          name: valid-suppressions
          path: findings

      - name: Download OPA Findings
        uses: actions/download-artifact@v4
        with:
          name: opa-findings
          path: findings

      - name: Download SAST Findings
        uses: actions/download-artifact@v4
        with:
          name: sast-findings
          path: findings

      - name: Download Secret Findings
        uses: actions/download-artifact@v4
        with:
          name: secret-findings
          path: findings

      - name: Download SCA Findings
        uses: actions/download-artifact@v4
        with:
          name: sca-findings
          path: findings

      - name: Debug Downloaded Files
        run: |
          echo "=== FILES ==="
          find findings -type f
          echo ""
          echo "=== SUPPRESSIONS ==="
          cat findings/valid_suppressions.json

      - name: Enrich Findings
        run: |
          python scripts/enrich.py

      - name: Upload Enriched Findings
        uses: actions/upload-artifact@v4
        with:
          name: enriched-findings
          path: findings/findings.json

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - remediation-enrichment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Findings Directory
        run: |
          mkdir -p findings

      - name: Download Enriched Findings
        uses: actions/download-artifact@v4
        with:
          name: enriched-findings
          path: findings

      - name: Security Decision
        run: python scripts/security_gate.py