name: Security Guardrails Platform

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:

  policy-as-code:
    name: OPA Policy Enforcement
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.50.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Generate Terraform JSON
        run: python scripts/tf_to_json.py

      - name: Run OPA Policy Check
        run: conftest test terraform/plan.json --policy policies/