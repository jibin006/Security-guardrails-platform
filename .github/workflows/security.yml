name: Security Guardrails Platform

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["main"]

jobs:

  policy-as-code:
    name: OPA Policy Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          tar xzf conftest_0.68.2_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Generate Terraform JSON
        run: python scripts/tf_to_json.py

      - name: Run OPA Policy Check
        run: |
          conftest test terraform/plan.json --policy policies/

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Create Findings Directory
        run: mkdir -p findings

      - name: Scan for Secrets
        run: |
          detect-secrets scan . \
            --exclude-files '\.secrets\.baseline' \
            > findings/secrets_raw.json

      - name: Validate Secret Findings
        run: |
          python scripts/check_secrets.py

  sast:
    name: SAST Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Create Findings Directory
        run: mkdir -p findings

      - name: Run Semgrep
        run: |
          semgrep \
            --config semgrep/custom-rules.yml \
            --json \
            --output findings/sast_findings.json \
            scripts/vulnerable_app.py

      - name: Validate SAST Findings
        run: |
          python scripts/check_sast.py

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Create Findings Directory
        run: mkdir -p findings

      - name: Run Dependency Scan
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output findings/sca_findings.json || true

      - name: Validate Dependency Findings
        run: |
          python scripts/check_dependencies.py